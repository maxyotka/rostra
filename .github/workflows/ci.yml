name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # The order is deliberate: the cheap checks that break most often come
      # first — css drifting from the tokens and a failed contrast pair show
      # up within seconds.
      - run: npm run check:tokens
      - run: npm run check:contrast
      - run: npm run check:support
      # The reference is generated from the types; a stale file means someone
      # changed a prop and left the documentation describing the old one.
      - run: npm run build:types
      - run: npm run check:api
      - run: npm run build:legacy
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The README quotes these numbers; the budgets keep them from drifting.
      - run: node scripts/check-size.mjs --check
      # A built package must also import: "the build succeeded" and "the
      # package exports something" are different claims.
      - name: Built package exposes its components
        run: |
          node -e "import('./dist/index.js').then(m => { if (!m.Button || !m.Dialog || !m.Rostra) throw new Error('esm exports nothing') })"
          node -e "if (!require('./dist/index.cjs').Button) throw new Error('cjs exports nothing')"
