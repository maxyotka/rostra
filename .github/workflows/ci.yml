name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Порядок неслучаен: сначала дешёвые проверки, которые ломаются чаще —
      # расхождение css с токенами и провал контраста видно за секунды.
      - run: npm run check:tokens
      - run: npm run check:contrast
      - run: npm run check:support
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Собранный пакет должен ещё и импортироваться: «сборка прошла» и
      # «из пакета что-то экспортируется» — разные утверждения.
      - name: Собранный пакет отдаёт компоненты
        run: |
          node -e "import('./dist/index.js').then(m => { if (!m.Button || !m.Dialog || !m.Rostra) throw new Error('esm без экспортов') })"
          node -e "if (!require('./dist/index.cjs').Button) throw new Error('cjs без экспортов')"
